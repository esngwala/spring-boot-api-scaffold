<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${subject}">Notification</title>
    <style>
        body { margin: 0; padding: 0; background-color: #f4f4f7; font-family: Arial, sans-serif; color: #333333; }
        .wrapper { width: 100%; background-color: #f4f4f7; padding: 40px 0; }
        .card { max-width: 560px; margin: 0 auto; background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .header { background-color: #0891b2; padding: 32px 40px; text-align: center; }
        .header h1 { margin: 0; color: #ffffff; font-size: 24px; letter-spacing: 0.5px; }
        .body { padding: 40px 40px 32px; }
        .body p { font-size: 15px; line-height: 1.7; margin: 0 0 16px; }
        .body .greeting { font-size: 18px; font-weight: bold; margin-bottom: 12px; }
        .message-box { background-color: #f0f9ff; border-left: 4px solid #0891b2; padding: 16px 20px; border-radius: 4px; font-size: 15px; line-height: 1.7; margin-bottom: 16px; }
        .footer { background-color: #f4f4f7; padding: 24px 40px; text-align: center; }
        .footer p { font-size: 12px; color: #888888; margin: 0; line-height: 1.6; }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="card">
        <div class="header">
            <h1 th:text="${appName}">MyApp</h1>
        </div>
        <div class="body">
            <p class="greeting" th:text="'Hi, ' + ${firstName} + '.'">Hi there.</p>
            <div class="message-box" th:text="${message}">
                Your notification message appears here.
            </div>
            <p>If you have questions or need help, feel free to reach out to our support team.</p>
        </div>
        <div class="footer">
            <p>© <span th:text="${year}">2026</span> <span th:text="${appName}">MyApp</span>. All rights reserved.</p>
            <p th:text="${supportEmail}">support@example.com</p>
        </div>
    </div>
</div>
</body>
</html>
