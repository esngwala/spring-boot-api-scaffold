spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/spring_scaffold?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:sbecom}
    password: ${RABBITMQ_PASS:sbecom@001!}

security:
  jwt:
    secret: ${JWT_SECRET:c3ByaW5nLXNjYWZmb2xkLWRldi1vbmx5LWtleS1jaGFuZ2UtbWUtcHJvZHVjdGlvbi1zZWNyZXQ=}

mail:
  from:
    address: ${FROM_EMAIL:no-reply@localhost}
    name: ${FROM_NAME:Spring Scaffold Local}

app:
  cors:
    allowed-origins:
      - ${CORS_ALLOWED_ORIGIN:http://localhost:3000}
    allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
    allowed-headers: [Authorization, Content-Type, Accept]
    exposed-headers: [Authorization]
    allow-credentials: true
    max-age: 3600
  rate-limit:
    capacity: 1000
    refill-tokens: 1000
    refill-period-seconds: 60

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
