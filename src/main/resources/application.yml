security:
    auth:
        refresh-token-ttl: P30D
    jwt:
        access-token-ttl: PT15M
        secret: ${JWT_SECRET}

spring:
    application:
        name: spring-scaffold
    servlet:
        multipart:
            enabled: true
            max-file-size: 50MB
            max-request-size: 100MB
            file-size-threshold: 10MB
    datasource:
        driver-class-name: com.mysql.cj.jdbc.Driver
        url: ${DB_URL}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
    flyway:
        baseline-on-migrate: true
        clean-disabled: true
        enabled: true
        locations: classpath:db/migration
    jpa:
        hibernate:
            ddl-auto: validate
        show-sql: false
    mail:
        host: ${SMTP_HOST}
        port: ${SMTP_PORT}
        username: ${SMTP_USER}
        password: ${SMTP_PASS}
        properties:
            mail:
                smtp:
                    auth: true
                    starttls:
                        enable: true
    rabbitmq:
        host: ${RABBITMQ_HOST}
        port: ${RABBITMQ_PORT}
        username: ${RABBITMQ_USER}
        password: ${RABBITMQ_PASS}

rabbitmq:
    email:
        exchange: springscaffold.email.exchange
        queues:
            welcome:
                name: springscaffold.email.welcome
                routing-key: email.welcome
            password-reset:
                name: springscaffold.email.password-reset
                routing-key: email.password-reset
            notification:
                name: springscaffold.email.notification
                routing-key: email.notification
        dead-letter:
            exchange: springscaffold.email.dlx
            queue: springscaffold.email.dead-letter
            routing-key: email.dead-letter

mail:
    from:
        address: ${FROM_EMAIL}
        name: ${FROM_NAME}

app:
    name: ${APP_NAME:Spring Scaffold}
    support-email: ${SUPPORT_EMAIL:support@example.com}
    base-url: ${APP_BASE_URL:http://localhost:8080}
    password-reset:
        token-ttl: PT15M
        reset-path: /reset-password
    email-verification:
        token-ttl: PT24H
        verify-path: /verify-email
    cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS}
        allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
        allowed-headers: Authorization,Content-Type,Accept
        exposed-headers: Authorization
        allow-credentials: true
        max-age: 3600
    rate-limit:
        capacity: ${RATE_LIMIT_CAPACITY:100}
        refill-tokens: ${RATE_LIMIT_REFILL_TOKENS:100}
        refill-period-seconds: ${RATE_LIMIT_REFILL_PERIOD_SECONDS:60}

    storage:
        type: local
        max-file-size-bytes: 52428800  # 50MB (matches Spring's multipart limit)
        local:
            base-path: ./uploads
            public-url-prefix: /files
