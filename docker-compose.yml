version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: spring-scaffold-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: spring_scaffold
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: sb-ecom-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: sbecom
      RABBITMQ_DEFAULT_PASS: sbecom@001!
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  mailpit:
    image: axllent/mailpit:latest
    container_name: sb-ecom-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI at http://localhost:8025
    restart: unless-stopped

volumes:
  rabbitmq_data:
